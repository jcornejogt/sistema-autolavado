name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generar aplicacion
        run: |
          pyinstaller --windowed --name SistemaAutolavado --add-data "assets;assets" app.py

      - name: Comprimir aplicacion
        run: Compress-Archive -Path dist\SistemaAutolavado\* -DestinationPath dist\SistemaAutolavado-Windows.zip

      - name: Guardar aplicacion
        uses: actions/upload-artifact@v4
        with:
          name: SistemaAutolavado-Windows
          path: dist/SistemaAutolavado-Windows.zip