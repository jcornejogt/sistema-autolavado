name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:

    runs-on: macos-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generar aplicación
        run: |
          pyinstaller \
            --windowed \
            --name "SistemaAutolavado" \
            --add-data "assets:assets" \
            app.py

      - name: Comprimir aplicación
        run: |
          cd dist
          zip -r SistemaAutolavado-macOS.zip SistemaAutolavado.app

      - name: Guardar aplicación
        uses: actions/upload-artifact@v4
        with:
          name: SistemaAutolavado-macOS
          path: dist/SistemaAutolavado-macOS.zip